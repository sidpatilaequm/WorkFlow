[alembic]
script_location = alembic
# This static URL is a placeholder only — alembic/env.py overrides it at
# runtime with the DATABASE_URL from .env, the same one database.py uses.
sqlalchemy.url = mysql+pymysql://root:password@localhost:3306/workflow_engine

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S